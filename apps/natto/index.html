<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Natto Stirrer | Yusuke Iwasaki</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/core/core.css?v=14">
<style>
  body { overflow: hidden; user-select: none; -webkit-user-select: none; }
  body.fz-has-drops { padding-top: 0; }  /* 全画面キャンバスなので、帯はその上に重ねるだけ */
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  .hud { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; pointer-events: none; }
  #rot { font: 40px 'DotGothic16', monospace; color: #ffe066; }
  #msg { font-weight: 800; margin-top: 6px; min-height: 1.4em; }
  #total { color: var(--muted); font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
<div class="fz-bar"><a href="/" data-i18n="back"></a><span id="right"><span data-i18n="title"></span></span></div>
<canvas id="c"></canvas>
<div class="hud">
  <div id="rot"></div>
  <div id="msg" data-i18n="intro"></div>
  <div id="total"></div>
</div>
<script src="/core/core.js?v=14"></script>
<script>
const APP = 'natto';
const T = {
  en: {
    back: '← Back', title: 'Natto Stirrer', intro: 'Trace circles around the bowl to stir',
    rot: n => n + ' stirs', total: n => 'Lifetime stirs: ' + n,
    msgs: { 5: 'Still just beans.', 20: 'A few threads appear', 50: 'Getting sticky', 100: 'Sticky', 200: 'Sticky sticky sticky',
            300: 'A gourmet somewhere nods, satisfied', 424: 'It is mostly threads now', 1000: 'The natto has become the universe' },
  },
  ja: {
    back: '← 戻る', title: '納豆まぜまぜ', intro: '器のまわりをぐるぐるなぞってまぜろ',
    rot: n => n + ' 回', total: n => '生涯まぜ回数 ' + n + ' 回',
    msgs: { 5: 'まだ豆。', 20: 'ちょっと糸が出てきた', 50: '粘りが出てきた', 100: 'ネバネバ', 200: 'ネバネバネバネバ',
            300: '北大路魯山人が頷いている', 424: 'もはや糸しかない', 1000: '納豆が宇宙になった' },
  },
};
let L = FZ.apply(T);
function setTitle() { document.title = L.title + ' | Yusuke Iwasaki'; }
setTitle();
FZ.langToggle(document.getElementById('right'));
const cv = document.getElementById('c'), g = cv.getContext('2d');
const rotEl = document.getElementById('rot'), msgEl = document.getElementById('msg'), totalEl = document.getElementById('total');
let W, H, R, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; R = Math.min(W, H) * 0.32;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize(); addEventListener('resize', resize);

// 豆
const beans = Array.from({ length: 46 }, () => ({ a: Math.random() * 6.28, r: Math.random() * 0.8, s: 0.5 + Math.random() * 0.8 }));
let session = 0, acc = 0, spin = 0, last = null, dragging = false;
let turnSpin = 0, inDrag = 0, lastDir = 0;   // 1周ぶんの向き・今回の指でまぜた数・前の周の向き

document.getElementById('rot').textContent = L.rot(0);

function angle(e) { return Math.atan2(e.clientY - H / 2, e.clientX - W / 2); }
cv.addEventListener('pointerdown', e => { dragging = true; last = angle(e); inDrag = 0; lastDir = 0; turnSpin = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', () => { dragging = false; last = null; });
cv.addEventListener('pointercancel', () => { dragging = false; last = null; });
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const a = angle(e);
  let d = a - last;
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  last = a;
  acc += Math.abs(d);
  spin += d;
  turnSpin += d;
  while (acc >= Math.PI * 2) {
    acc -= Math.PI * 2;
    session++;
    const dir = Math.sign(turnSpin) || 1;
    turnSpin = 0;
    if (dir < 0) FZ.add(APP, 'reverse', 1);                 // 画面上で反時計回り
    if (lastDir && dir !== lastDir) FZ.add(APP, 'switches', 1);
    lastDir = dir;
    FZ.max(APP, 'longStir', ++inDrag);
    FZ.add(APP, 'rotations', 1);
    rotEl.textContent = L.rot(session);
    if (L.msgs[session]) msgEl.textContent = L.msgs[session];
    showTotal();
  }
});
function showTotal() { totalEl.textContent = L.total(FZ.stat(APP, 'rotations')); }
showTotal();

function draw() {
  g.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 - 20;
  // 器
  g.fillStyle = '#f1e9da'; g.beginPath(); g.ellipse(cx, cy, R * 1.12, R * 1.12, 0, 0, 7); g.fill();
  g.fillStyle = '#d9cbb0'; g.beginPath(); g.ellipse(cx, cy, R, R, 0, 0, 7); g.fill();
  const sticky = Math.min(1, session / 300);
  const pos = beans.map(b => {
    const a = b.a + spin * b.s * 0.6;
    const r = R * (0.15 + b.r * 0.75);
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  });
  // 糸
  g.strokeStyle = `rgba(255,255,255,${0.15 + sticky * 0.6})`;
  g.lineWidth = 0.6 + sticky * 1.5;
  const links = Math.floor(sticky * 120);
  for (let i = 0; i < links; i++) {
    const p = pos[i % pos.length], q = pos[(i * 7 + 3) % pos.length];
    g.beginPath(); g.moveTo(p[0], p[1]);
    g.quadraticCurveTo(cx + Math.sin(spin + i) * 20, cy + Math.cos(spin + i) * 20, q[0], q[1]);
    g.stroke();
  }
  // 豆
  for (const [x, y] of pos) {
    g.fillStyle = '#8a5a2b'; g.beginPath(); g.ellipse(x, y, 9, 7, spin, 0, 7); g.fill();
    g.fillStyle = '#b07a43'; g.beginPath(); g.ellipse(x - 2, y - 2, 3, 2, spin, 0, 7); g.fill();
  }
  requestAnimationFrame(draw);
}
draw();
FZ.onLang(() => { L = T[FZ.lang()]; setTitle(); rotEl.textContent = L.rot(session); showTotal(); });
</script>
</body>
</html>
